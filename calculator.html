<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>계산기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    }

    .calc {
      width: 320px;
      padding: 20px;
      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    /* 표시 영역: 위쪽에 계산식, 아래쪽에 현재 숫자 */
    .display {
      min-height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 12px 8px;
      color: #f8fafc;
      overflow: hidden;
    }

    .expr {
      min-height: 22px;
      font-size: 16px;
      color: #94a3b8;
      white-space: nowrap;
    }

    .current {
      max-width: 100%;
      font-size: 44px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 64px;
      border: none;
      border-radius: 14px;
      font-size: 22px;
      cursor: pointer;
      background: #334155;
      color: #f1f5f9;
      transition: transform 0.05s, filter 0.15s;
    }

    button:hover { filter: brightness(1.15); }
    button:active { transform: scale(0.96); }
    button:focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }

    button.func { background: #64748b; }
    button.op { background: #f59e0b; color: #fff; }
    button.eq { background: #10b981; color: #fff; }
  </style>
</head>
<body>
  <main class="calc" aria-label="계산기">
    <section class="display">
      <div class="expr" id="expr"></div>
      <div class="current" id="current">0</div>
    </section>

    <div class="keys">
      <button class="func" data-action="clear">AC</button>
      <button class="func" data-action="backspace">⌫</button>
      <button class="func" data-action="percent">%</button>
      <button class="op" data-action="op" data-value="/">÷</button>

      <button data-action="digit" data-value="7">7</button>
      <button data-action="digit" data-value="8">8</button>
      <button data-action="digit" data-value="9">9</button>
      <button class="op" data-action="op" data-value="*">×</button>

      <button data-action="digit" data-value="4">4</button>
      <button data-action="digit" data-value="5">5</button>
      <button data-action="digit" data-value="6">6</button>
      <button class="op" data-action="op" data-value="-">−</button>

      <button data-action="digit" data-value="1">1</button>
      <button data-action="digit" data-value="2">2</button>
      <button data-action="digit" data-value="3">3</button>
      <button class="op" data-action="op" data-value="+">+</button>

      <button class="func" data-action="sign">±</button>
      <button data-action="digit" data-value="0">0</button>
      <button data-action="decimal">.</button>
      <button class="eq" data-action="equals">=</button>
    </div>
  </main>

  <script>
    // 계산기 상태
    // tokens: 완성된 숫자와 연산자가 번갈아 들어가는 배열 (예: [2, '+', 3, '*'])
    // input:  지금 화면에 보이는 숫자 문자열
    // fresh:  true이면 다음 숫자 입력 시 화면을 새로 시작함 (연산자/= 직후)
    const state = {
      tokens: [],
      input: '0',
      fresh: true
    };

    // 화면에 보여줄 연산자 기호
    const OP_LABEL = { '+': '+', '-': '−', '*': '×', '/': '÷' };

    // 결과를 소수점 12자리 유효숫자로 정리 (0.1 + 0.2 → 0.3)
    function formatResult(value) {
      return String(parseFloat(value.toPrecision(12)));
    }

    // 두 숫자에 연산자 하나를 적용하는 헬퍼
    function applyOperator(a, op, b) {
      switch (op) {
        case '+': return a + b;
        case '-': return a - b;
        case '*': return a * b;
        case '/':
          if (b === 0) throw new Error('0으로 나눌 수 없습니다');
          return a / b;
      }
    }

    /**
     * 토큰 배열(숫자와 연산자가 번갈아 나옴)을 계산해 결과를 반환합니다.
     *
     * TODO(human): 연산자 우선순위(× ÷ 가 + − 보다 먼저 계산되도록)를 지키는 계산 로직을 구현해 주세요.
     * 지금은 임시로 왼쪽에서 오른쪽으로 계산하므로 "2 + 3 × 4"가 20이 됩니다 (정답은 14).
     */
    function evaluateExpression(tokens) {
      let result = tokens[0];
      for (let i = 1; i < tokens.length; i += 2) {
        result = applyOperator(result, tokens[i], tokens[i + 1]);
      }
      return result;
    }

    // ---- 입력 처리 함수들 ----

    function inputDigit(digit) {
      if (state.fresh) {
        state.input = digit;
        state.fresh = false;
      } else if (state.input === '0') {
        state.input = digit;
      } else if (state.input.replace(/[-.]/g, '').length < 15) {
        state.input += digit;
      }
    }

    function inputDecimal() {
      if (state.fresh) {
        state.input = '0.';
        state.fresh = false;
      } else if (!state.input.includes('.')) {
        state.input += '.';
      }
    }

    function setOperator(op) {
      // 연산자를 연달아 누르면 마지막 연산자만 교체
      const last = state.tokens[state.tokens.length - 1];
      if (state.fresh && state.tokens.length && typeof last === 'string') {
        state.tokens[state.tokens.length - 1] = op;
        return;
      }
      state.tokens.push(Number(state.input), op);
      state.fresh = true;
    }

    function equals() {
      if (state.tokens.length === 0) return;

      state.tokens.push(Number(state.input));
      try {
        const result = evaluateExpression(state.tokens);
        if (!Number.isFinite(result)) throw new Error('계산 범위를 벗어났습니다');
        state.input = formatResult(result);
      } catch (error) {
        state.input = 'Error';
      }
      state.tokens = [];
      state.fresh = true;
    }

    function clearAll() {
      state.tokens = [];
      state.input = '0';
      state.fresh = true;
    }

    function backspace() {
      if (state.fresh) return;
      state.input = state.input.length > 1 ? state.input.slice(0, -1) : '0';
    }

    function percent() {
      state.input = formatResult(Number(state.input) / 100);
      state.fresh = false;
    }

    function toggleSign() {
      if (state.input === '0' || state.input === 'Error') return;
      state.input = state.input.startsWith('-') ? state.input.slice(1) : '-' + state.input;
    }

    // ---- 버튼 / 키보드 연결 ----

    function runAction(action, value) {
      switch (action) {
        case 'digit':    inputDigit(value); break;
        case 'decimal':  inputDecimal(); break;
        case 'op':       setOperator(value); break;
        case 'equals':   equals(); break;
        case 'clear':    clearAll(); break;
        case 'backspace': backspace(); break;
        case 'percent':  percent(); break;
        case 'sign':     toggleSign(); break;
      }
      render();
    }

    function render() {
      document.getElementById('expr').textContent =
        state.tokens.map(t => (typeof t === 'string' ? OP_LABEL[t] : t)).join(' ');
      document.getElementById('current').textContent = state.input;
    }

    document.querySelector('.keys').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button) return;
      runAction(button.dataset.action, button.dataset.value);
    });

    const KEY_ACTIONS = {
      '+': ['op', '+'], '-': ['op', '-'], '*': ['op', '*'], '/': ['op', '/'],
      'Enter': ['equals'], '=': ['equals'],
      'Backspace': ['backspace'], 'Escape': ['clear'],
      '%': ['percent'], '.': ['decimal']
    };

    document.addEventListener('keydown', (event) => {
      if (/^[0-9]$/.test(event.key)) {
        runAction('digit', event.key);
      } else if (KEY_ACTIONS[event.key]) {
        event.preventDefault(); // '/' 키의 브라우저 기본 동작 등을 막음
        runAction(...KEY_ACTIONS[event.key]);
      }
    });

    render();
  </script>
</body>
</html>
